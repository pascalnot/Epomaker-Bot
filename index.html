<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Legal Hub</title>

<style>
/* Background Animation */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(-45deg, #0f172a, #111827, #0b1220, #1e293b);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
  overflow-x: hidden;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Container */
.container {
  max-width: 700px;
  margin: 100px auto;
  padding: 20px;
  animation: fadeIn 1.2s ease-out;
}

/* Title */
h1 {
  font-size: 42px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

p {
  color: #94a3b8;
  margin-bottom: 30px;
}

/* Cards */
.card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 18px;
  margin: 15px 0;
  border-radius: 14px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

/* Glow effect */
.card::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(96,165,250,0.2), transparent 60%);
  transform: rotate(0deg);
  transition: 0.5s;
  opacity: 0;
}

.card:hover::before {
  opacity: 1;
  transform: rotate(25deg);
}

.card:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: rgba(96,165,250,0.4);
}

/* Links */
a {
  color: #60a5fa;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
}

/* Fade animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Floating subtle particles */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 30%, rgba(96,165,250,0.08), transparent 40%),
              radial-gradient(circle at 80% 70%, rgba(148,163,184,0.06), transparent 45%);
  pointer-events: none;
}
</style>
</head>

<body>

<div class="container">
  <h1>⚖️ Legal Hub</h1>
  <p>Choose a document below</p>

  <div class="card">
    📄 <a href="TERMS_OF_SERVICE.md">Terms of Service</a>
  </div>

  <div class="card">
    🔒 <a href="PRIVACY_POLICY.md">Privacy Policy</a>
  </div>

</div>

</body>
</html>
